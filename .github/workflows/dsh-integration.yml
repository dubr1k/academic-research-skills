name: DSH integration
on: [push, pull_request]
jobs:
  adapter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt pytest
      - run: python -m unittest discover -s integrations/dsh -p 'test_*.py' -v
      - run: python -m pytest -q scripts/test_check_role_scoped_contract.py scripts/test_check_390_revision_patch_discipline.py scripts/test_ars_apply_revision_patch.py
